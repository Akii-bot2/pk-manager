<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加予定・CSPランキング | ポケカ大会管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="./js/api.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    /* 表はスクショ前提。行の境界をはっきりさせる */
    .tbl th, .tbl td { border-bottom: 1px solid #1e2a4a; }
    .tbl tbody:last-child tr:last-child td { border-bottom: none; }
  </style>
</head>
<body class="min-h-screen text-white" style="background-color:#0a0e1a;">

  <!-- ===== HEADER ===== -->
  <header x-data="{ open: false }" class="sticky top-0 z-50 shadow-lg"
    style="background-color:#0f1629; border-bottom:2px solid #dc2626;">
    <div class="flex items-center justify-between px-4 py-3">
      <a href="./index.html" class="text-xl font-black tracking-tight" style="color:#fbbf24;">ポケカ大会管理</a>
      <button @click="open = !open" class="p-2 rounded-lg" style="color:#fbbf24;" aria-label="メニュー">
        <svg x-show="!open" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="open" x-cloak class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <nav x-show="open" x-cloak x-transition @click.outside="open = false" class="border-t"
      style="background-color:#161e3a; border-color:#1e2a4a;">
      <ul class="py-1">
        <template x-for="item in [
          { label: '参加予定・ランキング', href: './index.html' },
          { label: '大会記録', href: './records.html' },
          { label: 'メンバー', href: './member.html' },
          { label: '管理者', href: './admin.html' },
        ]" :key="item.href">
          <li><a :href="item.href" @click="open = false"
            class="block px-6 py-3 text-sm font-medium border-l-4 border-transparent transition-all"
            style="color:#e2e8f0;"
            onmouseover="this.style.borderLeftColor='#dc2626';this.style.backgroundColor='#1e2a4a';"
            onmouseout="this.style.borderLeftColor='transparent';this.style.backgroundColor='';"
            x-text="item.label"></a></li>
        </template>
      </ul>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main x-data="scheduleApp()" x-init="init()" class="max-w-3xl mx-auto px-4 py-6">

    <div class="flex items-center gap-3 mb-5">
      <div class="w-1 h-7 rounded-full" style="background-color:#dc2626;"></div>
      <h2 class="text-lg font-bold tracking-wide" style="color:#fbbf24;">シティリーグ参加予定・CSPランキング</h2>
    </div>

    <!-- 保存データを表示しながら最新を取得している間／最新の取得に失敗したときの案内 -->
    <div x-show="!loading && !loadError && (refreshing || refreshError)" x-cloak
      class="mb-3 px-3 py-2 rounded-lg text-xs flex items-center gap-2"
      :style="refreshError
        ? 'background-color:#2d0a0a; color:#fca5a5; border:1px solid #7f1d1d;'
        : 'background-color:#0f1629; color:#94a3b8; border:1px solid #1e2a4a;'">
      <svg x-show="refreshing" class="animate-spin w-3.5 h-3.5 flex-shrink-0" style="color:#fbbf24;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      <span x-text="refreshError || ('最新データを取得中…（' + formatCacheAge(oldestSavedAt) + 'のデータを表示中）')"></span>
      <button x-show="refreshError && !refreshing" x-cloak @click="refresh()"
        class="ml-auto flex-shrink-0 px-2 py-0.5 rounded font-bold" style="background-color:#1e2a4a; color:#e2e8f0;">再取得</button>
    </div>

    <!-- 年度タブ -->
    <div x-show="leagueYears.length > 1" x-cloak class="flex gap-2 mb-3 flex-wrap">
      <template x-for="year in leagueYears" :key="year">
        <button @click="selectYear(year)"
          class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all"
          :style="currentLeagueYear === year
            ? 'background-color:#dc2626; color:#fff;'
            : 'background-color:#161e3a; color:#94a3b8; border:1px solid #1e2a4a;'"
          x-text="year"></button>
      </template>
    </div>

    <!-- シーズンタブ -->
    <div x-show="!loading && yearSeasons.length > 0" x-cloak class="flex gap-2 mb-4 flex-wrap">
      <template x-for="s in yearSeasons" :key="s.id">
        <button @click="currentSeasonId = s.id; openId = null;"
          class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all"
          :style="String(currentSeasonId) === String(s.id)
            ? 'background-color:#fbbf24; color:#0a0e1a;'
            : 'background-color:#161e3a; color:#94a3b8; border:1px solid #1e2a4a;'"
          x-text="'S' + s.season_number"></button>
      </template>
    </div>

    <!-- ローディング -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-16 gap-4">
      <svg class="animate-spin w-10 h-10" style="color:#dc2626;" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      <span class="text-sm" style="color:#94a3b8;">読み込み中...</span>
      <span x-show="slowHint" x-cloak class="text-xs text-center px-6" style="color:#64748b;">
        サーバーが混み合っています。表示まで最大45秒ほどかかることがあります。<br>次回からは前回のデータをすぐに表示します。
      </span>
    </div>

    <div x-show="!loading && loadError" x-cloak class="rounded-xl p-6 text-center"
      style="background-color:#161e3a; border:1px solid #7f1d1d;">
      <p class="text-sm" style="color:#f87171;" x-text="loadError"></p>
      <button @click="init()" class="mt-4 text-sm px-4 py-2 rounded-lg"
        style="background-color:#1e2a4a; color:#94a3b8;">再読み込み</button>
    </div>

    <div x-show="!loading && !loadError && yearSeasons.length === 0" x-cloak
      class="rounded-xl p-6 text-center" style="background-color:#161e3a; border:1px solid #1e2a4a;">
      <p class="text-sm" style="color:#64748b;">この年度のシーズンが登録されていません。<br>管理者画面でシーズンを追加してください。</p>
    </div>

    <template x-if="!loading && !loadError && currentSeasonId">
      <div>
        <!-- 見出し（スクショに写る想定） -->
        <div class="rounded-t-xl px-4 py-3 flex items-baseline justify-between gap-3 flex-wrap"
          style="background-color:#1e2a4a;">
          <span class="font-black" style="color:#fbbf24;" x-text="currentSeasonName"></span>
          <span class="text-xs tabular-nums" style="color:#cbd5e1;">
            参加予定 <span class="font-bold" x-text="summary.planned"></span> ・
            不参加 <span class="font-bold" x-text="summary.absent"></span> ・
            未登録 <span class="font-bold" x-text="summary.none"></span>
          </span>
        </div>

        <!-- 表本体 -->
        <div class="overflow-x-auto rounded-b-xl" style="background-color:#161e3a; border:1px solid #1e2a4a; border-top:none;">
          <table class="tbl w-full text-sm" style="min-width:520px;">
            <thead>
              <tr class="text-left" style="background-color:#0f1629;">
                <th @click="sortBy('name')" class="px-3 py-2 font-bold cursor-pointer select-none whitespace-nowrap"
                  style="color:#94a3b8;">メンバー<span x-text="arrow('name')"></span></th>
                <th @click="sortBy('date')" class="px-3 py-2 font-bold cursor-pointer select-none whitespace-nowrap"
                  style="color:#94a3b8;">日付<span x-text="arrow('date')"></span></th>
                <th @click="sortBy('venue')" class="px-3 py-2 font-bold cursor-pointer select-none whitespace-nowrap"
                  style="color:#94a3b8;">会場<span x-text="arrow('venue')"></span></th>
                <!-- 通算CSP＝年度合計（シティ全シーズン＋トレリ）＝CSPランキング。
                     そのシーズン単体のCSPは表には出さず、行を開いた詳細（この回のCSP）で見せる -->
                <th @click="sortBy('csp')" class="px-3 py-2 font-bold cursor-pointer select-none whitespace-nowrap text-right"
                  style="color:#fbbf24;">通算CSP<span x-text="arrow('csp')"></span></th>
              </tr>
            </thead>
            <!-- 1行 = メイン行 + 詳細行 の2行なので、tbody を行ペアごとに分ける
                 （table 直下に複数の tbody を置くのは正当なHTML） -->
            <template x-for="row in sortedRows" :key="row.member_id">
                  <tbody>
                    <tr @click="toggleDetail(row.member_id)" class="cursor-pointer transition-colors"
                      :style="String(openId) === String(row.member_id) ? 'background-color:#1e2a4a;' : ''">
                      <td class="px-3 py-2 whitespace-nowrap">
                        <span class="text-xs tabular-nums mr-1" style="color:#64748b;"
                          x-text="'#' + row.community_rank"></span>
                        <span class="font-bold"
                          :style="row.status === 'none' ? 'color:#475569;' : 'color:#e2e8f0;'"
                          x-text="row.name"></span>
                        <template x-for="m in row.marks" :key="m">
                          <span class="ml-1" x-text="markIcon(m)" :title="markLabel(m)"></span>
                        </template>
                        <span class="text-xs ml-1" style="color:#64748b;"
                          x-text="String(openId) === String(row.member_id) ? '▾' : '▸'"></span>
                      </td>
                      <td class="px-3 py-2 whitespace-nowrap tabular-nums">
                        <span x-show="row.status === 'planned' || row.status === 'done'" style="color:#93c5fd;" x-text="row.dateLabel"></span>
                        <span x-show="row.status === 'planned_nodate'" style="color:#64748b;">日程未定</span>
                        <span x-show="row.status === 'absent'" class="px-2 py-0.5 rounded text-xs font-bold"
                          style="background-color:#374151; color:#9ca3af;">不参加</span>
                        <span x-show="row.status === 'none'" style="color:#475569;">未登録</span>
                      </td>
                      <td class="px-3 py-2" style="color:#e2e8f0;" x-text="row.venue || ''"></td>
                      <td class="px-3 py-2 text-right tabular-nums font-black"
                        :style="row.total_csp > 0 ? 'color:#fbbf24;' : 'color:#475569;'"
                        x-text="row.total_csp"></td>
                    </tr>
                    <!-- 詳細行 -->
                    <tr x-show="String(openId) === String(row.member_id)" x-cloak>
                      <td colspan="4" class="px-3 pb-3 pt-0" style="background-color:#1e2a4a;">
                        <div class="rounded-lg p-3 text-xs space-y-3" style="background-color:#0f1629;">

                          <!-- 年度通算CSP内訳（ランキングの中身） -->
                          <div>
                            <p class="font-bold mb-1" style="color:#fbbf24;"
                              x-text="currentLeagueYear + ' 通算CSP'"></p>
                            <div class="flex flex-wrap gap-x-4 gap-y-1">
                              <span style="color:#64748b;">シティ計 <span class="font-bold tabular-nums" style="color:#e2e8f0;" x-text="row.city_csp + 'pt'"></span></span>
                              <span style="color:#64748b;">トレリ計 <span class="font-bold tabular-nums" style="color:#e2e8f0;" x-text="row.trainer_csp + 'pt'"></span></span>
                              <span style="color:#64748b;">合計 <span class="font-black tabular-nums" style="color:#fbbf24;" x-text="row.total_csp + 'pt'"></span></span>
                              <span style="color:#64748b;">コミュニティ内 <span class="font-bold tabular-nums" style="color:#e2e8f0;" x-text="row.community_rank + '位'"></span></span>
                            </div>
                            <div x-show="row.marks.length > 0" x-cloak class="flex flex-wrap gap-1 mt-2">
                              <template x-for="m in row.marks" :key="m">
                                <span class="px-1.5 py-0.5 rounded font-bold" :style="markStyle(m)"
                                  x-text="markIcon(m) + ' ' + markLabel(m)"></span>
                              </template>
                            </div>
                          </div>

                          <!-- このシーズンの内容 -->
                          <div class="pt-2 border-t" style="border-color:#1e2a4a;">
                            <p class="font-bold mb-1" style="color:#93c5fd;"
                              x-text="currentSeasonName + ' の参加内容'"></p>
                            <template x-if="row.status === 'none'">
                              <p style="color:#64748b;">このシーズンはまだ登録されていません。</p>
                            </template>
                            <template x-if="row.status === 'absent'">
                              <p style="color:#9ca3af;">不参加で登録されています。</p>
                            </template>
                            <template x-if="row.status !== 'none' && row.status !== 'absent'">
                              <div class="grid grid-cols-2 gap-x-4 gap-y-2">
                                <div><span style="color:#64748b;">日付</span><br>
                                  <span style="color:#e2e8f0;" x-text="row.dateFull || '未定'"></span></div>
                                <div><span style="color:#64748b;">会場</span><br>
                                  <span style="color:#e2e8f0;" x-text="row.venue || '未定'"></span></div>
                                <div><span style="color:#64748b;">順位</span><br>
                                  <span style="color:#e2e8f0;" x-text="row.rank ? row.rank + '位' : '—'"></span></div>
                                <div><span style="color:#64748b;">参加人数</span><br>
                                  <span style="color:#e2e8f0;" x-text="row.participants ? row.participants + '人' : '—'"></span></div>
                                <div><span style="color:#64748b;">この回のCSP</span><br>
                                  <span class="font-bold" :style="row.seasonCsp > 0 ? 'color:#fbbf24;' : 'color:#64748b;'"
                                    x-text="row.status === 'done' ? row.seasonCsp + 'pt' : '結果未入力'"></span></div>
                                <div><span style="color:#64748b;">デッキコード</span><br>
                                  <span style="color:#e2e8f0;" x-text="row.deck_code || '—'"></span></div>
                              </div>
                            </template>
                          </div>

                          <div class="pt-1 flex gap-2 flex-wrap">
                            <a :href="'./member.html?id=' + row.member_id" @click.stop
                              class="px-3 py-1 rounded font-bold"
                              style="background-color:#1e3a5f; color:#93c5fd;">個人ページ</a>
                            <a href="./records.html" @click.stop
                              class="px-3 py-1 rounded font-bold"
                              style="background-color:#1a2e1a; color:#4ade80;">登録・結果入力</a>
                          </div>
                        </div>
                      </td>
                    </tr>
                  </tbody>
            </template>
          </table>
        </div>

        <p class="text-xs mt-3" style="color:#64748b;">
          見出しをタップすると並び替え、名前をタップすると詳細（CSP内訳・順位・参加人数・デッキコード）が開きます。<br>
          <span style="color:#fbbf24;">通算CSP</span>は年度合計（シティ全シーズン＋トレリ）。この列で並び替えるとCSPランキングになります。
        </p>
      </div>
    </template>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="mt-10 py-6 px-4 text-center border-t" style="border-color:#1e2a4a;">
    <p class="text-xs" style="color:#64748b;">※ ランキングはコミュニティ内の順位です。全国順位とは異なります。</p>
  </footer>

  <script>
    function scheduleApp() {
      // 会場名の並べ替え用（かな・英数は正しく並ぶ。漢字は読みが取れないためコード順）
      const jaCollator = new Intl.Collator('ja');
      const DOW = ['日', '月', '火', '水', '木', '金', '土'];

      const MARKS = {
        WCS: { icon: '🌍', label: 'WCS',    style: 'background-color:#7c3aed; color:#fff;' },
        JCS: { icon: '🇯🇵', label: 'JCS',    style: 'background-color:#1d4ed8; color:#fff;' },
        CL:  { icon: '🎯', label: '次回CL', style: 'background-color:#065f46; color:#fff;' },
      };

      return {
        loading: true,
        loadError: '',
        ranking: [],   // getRanking の結果（年度通算CSP・順位・マーク込み。全メンバーが入る）
        seasons: [],
        city: [],
        leagueYears: [],
        currentLeagueYear: '',
        currentSeasonId: '',
        openId: null,
        sortKey: 'date',
        sortAsc: true,

        // ---- 通信状態（端末の保存データを先に表示し、裏で最新を取る） ----
        refreshError: '',     // 最新の取得に失敗したが、保存データで表示は続けているとき
        pending: 0,           // 裏で実行中の取得の数
        rankingRequestId: 0,  // 年度切り替えと重なったとき、古い応答で上書きしないための番号
        // 各データをいつ取得したものか（0 = まだ無い）。保存データなら過去の時刻になる
        savedAt: { ranking: 0, seasons: 0, city: 0 },

        slowHint: false,      // 保存データが無く待たされているときに「混み合っています」を出す

        async init() {
          this.loadError = '';
          this.refreshError = '';

          // ① 前回表示したデータが端末に残っていれば、GASを待たずにすぐ表示する
          const cachedRanking = readGasCache('getRanking');
          const cachedSeasons = readGasCache('getSeasons');
          const cachedCity    = readGasCache('getCity');
          if (cachedRanking && cachedSeasons && cachedCity) {
            this.applyData(
              { ranking: cachedRanking.data, seasons: cachedSeasons.data, city: cachedCity.data },
              { ranking: cachedRanking.savedAt, seasons: cachedSeasons.savedAt, city: cachedCity.savedAt },
            );
            this.loading = false;
          } else {
            this.loading = true;
          }

          // 保存データが無いと表の代わりにスピナーだけになるので、長引いたら混雑中だと伝える
          this.slowHint = false;
          const hintTimer = setTimeout(() => { if (this.loading) this.slowHint = true; }, 8000);

          // ② 裏で最新を取りに行き、届いたものから差し替える
          await this.refresh();
          clearTimeout(hintTimer);
          this.slowHint = false;
        },

        async refresh() {
          const rankingParams = this.rankingParamsFor(this.currentLeagueYear);
          const requestId = ++this.rankingRequestId;
          this.refreshError = '';
          this.pending++;

          // getRanking はメンバー一覧も兼ねる（全メンバーを0ptでも返す）ので getMembers は呼ばない
          const [rRes, sRes, cRes] = await Promise.allSettled([
            gasGet('getRanking', rankingParams),
            gasGet('getSeasons'),
            gasGet('getCity'),
          ]);
          this.pending--;

          // 待っている間に年度が切り替えられていたら、このランキングは使わない
          const rankingCurrent = requestId === this.rankingRequestId;
          const now = Date.now();
          const fresh = {}, at = {};
          if (rankingCurrent && rRes.status === 'fulfilled') { fresh.ranking = rRes.value; at.ranking = now; }
          if (sRes.status === 'fulfilled') { fresh.seasons = sRes.value; at.seasons = now; }
          if (cRes.status === 'fulfilled') { fresh.city = cRes.value; at.city = now; }
          this.applyData(fresh, at);

          const failed = [rankingCurrent ? rRes : null, sRes, cRes].find(r => r && r.status === 'rejected');
          if (failed) {
            if (this.hasData) {
              this.refreshError = `最新データを取得できませんでした（${formatCacheAge(this.oldestSavedAt)}のデータを表示中）。${failed.reason.message}`;
            } else {
              this.loadError = failed.reason.message || 'データの取得に失敗しました。';
            }
          }
          this.loading = false;
        },

        // 取得したデータを反映する。ユーザーが選んでいた年度・シーズンは、新しいデータにも存在する限り維持する
        applyData(data, at) {
          if (data.ranking) { this.ranking = data.ranking; this.savedAt.ranking = at.ranking; }
          if (data.seasons) { this.seasons = data.seasons; this.savedAt.seasons = at.seasons; }
          if (data.city)    { this.city    = data.city;    this.savedAt.city    = at.city; }

          this.leagueYears = [...new Set(this.seasons.map(s => s.league_year).filter(Boolean))].sort();
          if (!this.leagueYears.includes(this.currentLeagueYear)) {
            this.currentLeagueYear = this.leagueYears.length > 0 ? this.leagueYears[this.leagueYears.length - 1] : '';
          }
          if (!this.yearSeasons.some(s => String(s.id) === String(this.currentSeasonId))) {
            this.pickFirstSeason();
          }
        },

        get hasData() {
          return this.savedAt.ranking > 0 && this.savedAt.seasons > 0 && this.savedAt.city > 0;
        },

        get oldestSavedAt() {
          return Math.min(this.savedAt.ranking, this.savedAt.seasons, this.savedAt.city);
        },

        get refreshing() {
          return this.pending > 0;
        },

        // 最新年度はパラメータ無し（サーバー側の既定＝最新年度）で呼び、初回表示と保存データを共有する
        rankingParamsFor(year) {
          const latest = this.leagueYears[this.leagueYears.length - 1];
          return (!year || year === latest) ? {} : { league_year: year };
        },

        // 年度を切り替えるとCSP集計の対象年度も変わるので、ランキングを取り直す
        async selectYear(year) {
          if (this.currentLeagueYear === year) return;
          this.currentLeagueYear = year;
          this.openId = null;
          this.pickFirstSeason();

          const params = this.rankingParamsFor(year);
          const requestId = ++this.rankingRequestId;
          const cached = readGasCache('getRanking', params);
          if (cached) { this.ranking = cached.data; this.savedAt.ranking = cached.savedAt; }

          this.refreshError = '';
          this.pending++;
          try {
            const fresh = await gasGet('getRanking', params);
            if (requestId === this.rankingRequestId) { this.ranking = fresh; this.savedAt.ranking = Date.now(); }
          } catch (e) {
            if (requestId === this.rankingRequestId) {
              this.refreshError = cached
                ? `最新のCSPを取得できませんでした（${formatCacheAge(cached.savedAt)}のデータを表示中）。${e.message}`
                : 'CSPの取得に失敗しました: ' + e.message;
            }
          } finally {
            this.pending--;
          }
        },

        // 開いたときに表示するシーズンを決める。
        // これから開催される予定が入っている一番早いシーズンを優先し、無ければ S1。
        pickFirstSeason() {
          const list = this.yearSeasons;
          if (list.length === 0) { this.currentSeasonId = ''; return; }
          const today = new Date().toISOString().slice(0, 10);
          const upcoming = list.find(s => this.city.some(e =>
            String(e.season_id) === String(s.id) && e.date && String(e.date) >= today
          ));
          this.currentSeasonId = (upcoming || list[0]).id;
        },

        get yearSeasons() {
          return this.seasons
            .filter(s => !this.currentLeagueYear || s.league_year === this.currentLeagueYear)
            .sort((a, b) => Number(a.season_number) - Number(b.season_number));
        },

        get currentSeasonName() {
          const s = this.seasons.find(x => String(x.id) === String(this.currentSeasonId));
          return s ? s.name : '';
        },

        // メンバー全員分の行を作る（未登録のメンバーも行として出す）
        // CSPは年度通算（ranking由来）、日付・会場・順位は選択中シーズン（city由来）
        get rows() {
          const bySeason = this.city.filter(e => String(e.season_id) === String(this.currentSeasonId));
          return this.ranking.map(r => {
            const e = bySeason.find(x => String(x.member_id) === String(r.id));
            const base = {
              member_id:      r.id,
              name:           r.name,
              city_csp:       Number(r.city_csp) || 0,
              trainer_csp:    Number(r.trainer_csp) || 0,
              total_csp:      Number(r.total_csp) || 0,
              community_rank: r.community_rank,
              marks:          r.marks || [],
            };
            if (!e) {
              return { ...base, status: 'none', date: '', dateLabel: '', dateFull: '',
                       venue: '', rank: '', participants: '', deck_code: '', seasonCsp: 0 };
            }
            const absent = Number(e.is_absent) === 1;
            const hasResult = !!e.rank;
            const status = absent ? 'absent' : (hasResult ? 'done' : (e.date ? 'planned' : 'planned_nodate'));
            return {
              ...base,
              status,
              date: e.date || '',
              dateLabel: this.formatShort(e.date),
              dateFull: e.date || '',
              venue: absent ? '' : (e.venue || ''),
              rank: e.rank || '',
              participants: e.participants_count || '',
              deck_code: e.deck_code || '',
              seasonCsp: Number(e.csp_earned) || 0,
            };
          });
        },

        get summary() {
          const r = this.rows;
          return {
            planned: r.filter(x => x.status === 'planned' || x.status === 'planned_nodate' || x.status === 'done').length,
            absent:  r.filter(x => x.status === 'absent').length,
            none:    r.filter(x => x.status === 'none').length,
          };
        },

        get sortedRows() {
          const dir = this.sortAsc ? 1 : -1;

          // CSP順のときは「ランキング」として見るので、参加状況でのグループ分けをしない。
          // （未登録でもCSPが高い人が下に沈むと順位表として成立しないため）
          if (this.sortKey === 'csp') {
            return [...this.rows].sort((a, b) =>
              (a.total_csp - b.total_csp) * dir || jaCollator.compare(a.name, b.name));
          }

          // それ以外は 日程未定→不参加→未登録 を下にまとめる（スクショで上部が見やすいように）
          const RANK = { done: 0, planned: 0, planned_nodate: 1, absent: 2, none: 3 };
          return [...this.rows].sort((a, b) => {
            const w = RANK[a.status] - RANK[b.status];
            if (w !== 0) return w;
            let c = 0;
            switch (this.sortKey) {
              case 'name':      c = jaCollator.compare(a.name, b.name); break;
              case 'venue':     c = jaCollator.compare(a.venue, b.venue); break;
              default:          c = String(a.date).localeCompare(String(b.date)); break;
            }
            if (c !== 0) return c * dir;
            return jaCollator.compare(a.name, b.name);
          });
        },

        sortBy(key) {
          if (this.sortKey === key) {
            this.sortAsc = !this.sortAsc;
          } else {
            this.sortKey = key;
            // CSPだけは「高い順」から始めるのが自然
            this.sortAsc = (key !== 'csp');
          }
        },

        arrow(key) {
          if (this.sortKey !== key) return '';
          return this.sortAsc ? ' ▲' : ' ▼';
        },

        markIcon(m)  { return (MARKS[m] || {}).icon  || ''; },
        markLabel(m) { return (MARKS[m] || {}).label || m; },
        markStyle(m) { return (MARKS[m] || {}).style || ''; },

        toggleDetail(id) {
          this.openId = String(this.openId) === String(id) ? null : id;
        },

        // "2026-10-13" → "10/13(火)" ／ 桁を揃えて表として読みやすくする
        formatShort(iso) {
          if (!iso) return '';
          const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (!m) return String(iso);
          const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
          return `${m[2]}/${m[3]}(${DOW[d.getDay()]})`;
        },
      };
    }
  </script>
</body>
